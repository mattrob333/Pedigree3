<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pedigree White Paper · The Agent Chain of Command</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf7;
    --text: #1f2937;
    --muted: #64748b;
    --rule: #e2e8f0;
    --accent: #4f46e5;
    --code-bg: #0f172a;
    --code-text: #e2e8f0;
    --inline-code-bg: #f1f5f9;
    --quote-border: #cbd5e1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 17px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  .nav {
    position: sticky; top: 0; z-index: 10;
    background: rgba(250, 250, 247, 0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rule);
    padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
    font-size: 14px;
  }
  .nav .brand { font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; font-weight: 400; }
  .nav a { color: var(--accent); text-decoration: none; margin-left: 16px; }
  .nav a:hover { text-decoration: underline; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 48px 28px 120px; }
  .loading { color: var(--muted); text-align: center; padding: 80px 0; font-size: 15px; }

  /* Typography rendered from markdown */
  #content h1 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1.15; margin: 48px 0 18px; }
  #content h1:first-child { margin-top: 0; }
  #content h2 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.2; margin: 40px 0 14px; color: #0f172a; }
  #content h3 { font-weight: 600; font-size: 19px; margin: 28px 0 10px; letter-spacing: -0.01em; }
  #content h4 { font-weight: 600; font-size: 16px; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  #content p { margin: 0 0 16px; }
  #content ul, #content ol { padding-left: 24px; margin: 0 0 18px; }
  #content li { margin: 4px 0; }
  #content a { color: var(--accent); }
  #content blockquote {
    border-left: 3px solid var(--quote-border);
    background: #ffffff;
    margin: 20px 0;
    padding: 12px 18px;
    color: #334155;
    border-radius: 0 6px 6px 0;
    font-style: italic;
  }
  #content blockquote p:last-child { margin-bottom: 0; }
  #content hr { border: 0; border-top: 1px solid var(--rule); margin: 40px 0; }
  #content code {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    background: var(--inline-code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.88em;
    color: #0f172a;
  }
  #content pre {
    background: var(--code-bg);
    color: var(--code-text);
    padding: 16px 18px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 18px 0;
    font-size: 14px;
    line-height: 1.55;
  }
  #content pre code {
    background: transparent;
    color: inherit;
    padding: 0;
    font-size: inherit;
  }
  #content table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 15px; }
  #content th, #content td { border: 1px solid var(--rule); padding: 8px 12px; text-align: left; }
  #content th { background: #f8fafc; font-weight: 600; }
  #content strong { font-weight: 600; color: #0f172a; }
  #content em { color: #475569; }
  .footer { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<nav class="nav">
  <div class="brand">Pedigree</div>
  <div>
    <a href="index.html">Home</a>
    <a href="demo.html">Interactive Demo</a>
    <a href="whitepaper.md">Raw Markdown</a>
  </div>
</nav>
<main class="wrap">
  <div id="content" class="loading">Loading white paper&hellip;</div>
  <div class="footer">
    Pedigree &middot; White Paper &middot; <a href="whitepaper.md">View source markdown</a>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
<script>
  (async () => {
    const el = document.getElementById('content');
    try {
      const res = await fetch('whitepaper.md', { cache: 'no-store' });
      if (!res.ok) throw new Error('Failed to load whitepaper.md (' + res.status + ')');
      const md = await res.text();
      marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });
      el.classList.remove('loading');
      el.innerHTML = marked.parse(md);
      // Update document title from first H1 if present
      const firstH1 = el.querySelector('h1');
      if (firstH1) document.title = firstH1.textContent + ' · Pedigree';
    } catch (err) {
      el.classList.remove('loading');
      el.innerHTML = '<p style="color:#b91c1c">Could not load whitepaper.md: ' + err.message + '</p>';
    }
  })();
</script>
</body>
</html>
